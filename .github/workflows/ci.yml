name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: services/cli/go.sum

      - name: Tidy dependencies
        run: cd services/cli && go mod tidy

      - name: Build
        run: cd services/cli && go build ./...

      - name: Test
        run: cd services/cli && go test ./... -v -timeout 60s

      - name: Set up Node for release artifact gate
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check release artifact gate
        run: node --test .github/scripts/check-cli-release.test.cjs

  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: services/cli/go.sum

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

  npm:
    runs-on: ubuntu-latest
    needs: [test, release]
    # GoReleaser can publish the signed GitHub artifacts before Homebrew fails.
    # Keep that failure visible, but allow npm when the exact release is complete.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require published GitHub release artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { requirePublishedRelease } = require('./.github/scripts/check-cli-release.cjs');
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            const assets = requirePublishedRelease(data, tag);
            core.info(`Verified published ${tag}: ${assets.join(', ')}`);

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish to npm
        run: |
          cd npm
          npm --version
          npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
